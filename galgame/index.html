<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>夏色物語 ～忘れられた約束～</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&family=Zen+Maru+Gothic:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
<style>
:root{
  --pink:#ff8fb3; --blue:#8fc3ff; --purple:#b8a8ff; --cream:#fff8f0;
  --ink:#4a4252; --ink-soft:#8b8095; --glass:rgba(255,255,255,.42);
  --glass-brd:rgba(255,255,255,.65); --shadow:0 8px 32px rgba(120,90,140,.18);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;background:#fdf6f2;font-family:'Zen Maru Gothic','Noto Sans SC',sans-serif;color:var(--ink)}
#game-canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
.hidden{display:none !important}

/* ---------- loading ---------- */
#loading{position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;background:linear-gradient(160deg,#fdf6f2,#ffeef6 55%,#eef4ff);transition:opacity .5s}
#loading.hidden{opacity:0;pointer-events:none}
.load-logo{font-size:clamp(22px,5vw,44px);font-weight:700;letter-spacing:.14em;background:linear-gradient(120deg,#ff8fb3,#b8a8ff,#8fc3ff);-webkit-background-clip:text;background-clip:text;color:transparent;animation:floaty 2.6s ease-in-out infinite}
.load-sub{font-size:clamp(11px,1.6vw,15px);color:var(--ink-soft);letter-spacing:.35em}
#loadbar-wrap{width:min(320px,60vw);height:8px;border-radius:99px;background:rgba(255,255,255,.6);overflow:hidden;box-shadow:inset 0 1px 3px rgba(0,0,0,.08)}
#loadbar{width:0%;height:100%;border-radius:99px;background:linear-gradient(90deg,#ffb7cd,#b8a8ff,#8fc3ff);transition:width .4s ease}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}

/* ---------- main menu ---------- */
#mainmenu{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;background:linear-gradient(180deg,rgba(255,244,248,.25),rgba(255,255,255,.08) 45%,rgba(90,80,120,.25));backdrop-filter:blur(2px)}
.mm-inner{display:flex;flex-direction:column;align-items:center;gap:10px;padding:46px 56px;border-radius:30px;background:var(--glass);border:1px solid var(--glass-brd);box-shadow:var(--shadow);backdrop-filter:blur(18px) saturate(1.5)}
.mm-title{font-size:clamp(26px,5.4vw,48px);font-weight:700;letter-spacing:.12em;text-align:center;background:linear-gradient(120deg,#e05a8f,#9a7fe0 55%,#4f8fd8);-webkit-background-clip:text;background-clip:text;color:transparent;line-height:1.35}
.mm-sub{font-size:clamp(10px,1.6vw,14px);color:var(--ink-soft);letter-spacing:.5em;margin-bottom:14px}
.mm-buttons{display:flex;flex-direction:column;gap:12px;width:min(300px,72vw)}
.mm-btn{font-family:inherit;font-size:clamp(14px,1.9vw,17px);letter-spacing:.3em;padding:13px 10px;border-radius:16px;border:1px solid rgba(255,255,255,.7);background:rgba(255,255,255,.55);color:var(--ink);cursor:pointer;backdrop-filter:blur(10px);box-shadow:0 4px 14px rgba(120,90,140,.12);transition:transform .18s, box-shadow .18s, background .18s}
.mm-btn:hover{transform:translateY(-3px) scale(1.02);background:rgba(255,255,255,.85);box-shadow:0 10px 26px rgba(255,140,180,.35)}
.mm-btn:active{transform:scale(.97)}
.mm-tip{font-size:clamp(9px,1.2vw,12px);color:var(--ink-soft);margin-top:12px;text-align:center;line-height:1.8;letter-spacing:.08em}
.mm-ver{font-size:10px;color:rgba(139,128,149,.7);margin-top:2px;letter-spacing:.2em}

/* ---------- HUD ---------- */
#hud{position:fixed;inset:0;z-index:40;pointer-events:none}
#hud>*{pointer-events:auto}
.chip{position:absolute;top:18px;left:18px;display:flex;align-items:center;gap:8px;padding:8px 16px;border-radius:99px;background:var(--glass);border:1px solid var(--glass-brd);backdrop-filter:blur(14px);box-shadow:var(--shadow);font-size:clamp(11px,1.5vw,14px);letter-spacing:.12em}
.chip-dot{width:8px;height:8px;border-radius:50%;background:linear-gradient(120deg,#ff8fb3,#8fc3ff);box-shadow:0 0 8px rgba(255,140,180,.8)}
.hearts{position:absolute;top:20px;left:50%;transform:translateX(-50%);display:flex;gap:7px;padding:8px 14px;border-radius:99px;background:var(--glass);border:1px solid var(--glass-brd);backdrop-filter:blur(14px)}
.heart{width:16px;height:16px;transform:rotate(45deg);border-radius:2px;background:rgba(255,255,255,.35);transition:background .3s}
.heart.on{background:linear-gradient(135deg,#ff8fb3,#ff5f8f);box-shadow:0 0 8px rgba(255,95,143,.7);animation:heartbeat 1.2s ease-in-out infinite}
.heart.off{opacity:.55}
@keyframes heartbeat{0%,100%{transform:rotate(45deg) scale(1)}50%{transform:rotate(45deg) scale(1.16)}}
.round-btn{position:absolute;top:18px;right:18px;width:44px;height:44px;border-radius:50%;border:1px solid var(--glass-brd);background:var(--glass);backdrop-filter:blur(14px);box-shadow:var(--shadow);font-size:20px;color:var(--ink);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:transform .18s}
.round-btn:hover{transform:scale(1.1)}

/* ---------- dialog ---------- */
#dialog{position:absolute;left:50%;bottom:22px;transform:translateX(-50%);width:min(880px,94vw);display:flex;gap:14px;align-items:flex-start;padding:18px 22px;border-radius:24px;background:rgba(255,255,255,.5);border:1px solid rgba(255,255,255,.75);backdrop-filter:blur(20px) saturate(1.6);box-shadow:0 14px 44px rgba(90,70,120,.22);min-height:118px;cursor:pointer;transition:opacity .3s}
#dialog-portrait{width:86px;height:86px;border-radius:18px;object-fit:cover;background:rgba(255,255,255,.35);flex:none;border:1px solid rgba(255,255,255,.6)}
.dlg-right{flex:1;display:flex;flex-direction:column;gap:8px;min-width:0}
#dialog-name{display:inline-block;align-self:flex-start;font-size:clamp(11px,1.5vw,14px);font-weight:700;letter-spacing:.14em;padding:4px 14px;border-radius:99px;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.25)}
#dialog-text{font-size:clamp(14px,2vw,18px);line-height:1.9;letter-spacing:.04em;min-height:56px;word-break:break-word}
#dialog-text.center-narr{text-align:center;color:var(--ink-soft)}
.tap{position:absolute;right:22px;bottom:14px;font-size:14px;color:var(--pink);animation:tapbounce 1s ease-in-out infinite;transition:opacity .2s}
@keyframes tapbounce{0%,100%{transform:translateY(0)}50%{transform:translateY(5px)}}

/* ---------- choices ---------- */
#choices{position:absolute;left:50%;bottom:172px;transform:translateX(-50%);width:min(720px,92vw);display:flex;flex-direction:column;gap:12px;z-index:5}
.choice{font-family:inherit;text-align:left;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 20px;border-radius:18px;border:1px solid rgba(255,255,255,.75);background:rgba(255,255,255,.62);backdrop-filter:blur(18px);box-shadow:var(--shadow);color:var(--ink);font-size:clamp(13px,1.8vw,16px);cursor:pointer;transition:transform .16s, background .16s, border-color .16s;animation:popin .3s ease backwards}
.choice:nth-child(1){animation-delay:.05s}.choice:nth-child(2){animation-delay:.12s}.choice:nth-child(3){animation-delay:.19s}
.choice:hover{transform:translateX(6px);background:rgba(255,255,255,.92);border-color:rgba(255,143,179,.65)}
.choice-h{flex:none;font-size:clamp(9px,1.2vw,12px);color:var(--purple);background:rgba(184,168,255,.22);padding:3px 10px;border-radius:99px;white-space:nowrap}
@keyframes popin{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}

/* ---------- toast ---------- */
#toast{position:absolute;top:86px;left:50%;transform:translateX(-50%);padding:9px 22px;border-radius:99px;background:rgba(90,70,120,.55);backdrop-filter:blur(14px);color:#fff;font-size:clamp(11px,1.5vw,14px);letter-spacing:.1em;opacity:0;transition:opacity .35s, transform .35s;pointer-events:none}
#toast.show-toast{opacity:1;transform:translateX(-50%) translateY(6px)}

/* ---------- chapter card ---------- */
#chaptercard{position:fixed;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;pointer-events:none;opacity:0;transition:opacity .6s}
#chaptercard.show-card{opacity:1}
.card-inner{text-align:center;padding:34px 60px;border-radius:26px;background:var(--glass);border:1px solid var(--glass-brd);backdrop-filter:blur(18px);box-shadow:var(--shadow);transform:translateY(16px);transition:transform .6s}
#chaptercard.show-card .card-inner{transform:translateY(0)}
#chap-title{font-size:clamp(22px,4.4vw,38px);font-weight:700;letter-spacing:.2em;background:linear-gradient(120deg,#e05a8f,#8fc3ff);-webkit-background-clip:text;background-clip:text;color:transparent}
#chap-sub{font-size:14px;color:var(--ink-soft);letter-spacing:.3em;margin-top:10px}

/* ---------- modal ---------- */
#modal{position:fixed;inset:0;z-index:70;display:flex;align-items:center;justify-content:center;background:rgba(70,55,95,.35);backdrop-filter:blur(6px);animation:fadein .25s ease}
.modal-box{width:min(620px,92vw);max-height:82vh;display:flex;flex-direction:column;border-radius:26px;background:rgba(255,255,255,.86);border:1px solid rgba(255,255,255,.9);backdrop-filter:blur(24px);box-shadow:0 20px 60px rgba(70,50,100,.3);overflow:hidden;animation:popin .3s ease}
.modal-head{display:flex;align-items:center;justify-content:space-between;padding:16px 24px;border-bottom:1px solid rgba(120,90,140,.12)}
.modal-head span{font-size:17px;font-weight:700;letter-spacing:.2em}
#modal-close{width:34px;height:34px;border-radius:50%;border:none;background:rgba(120,90,140,.12);color:var(--ink);font-size:14px;cursor:pointer}
#modal-close:hover{background:rgba(255,143,179,.3)}
#modal-body{overflow-y:auto;padding:20px 24px;max-height:calc(82vh - 70px)}
@keyframes fadein{from{opacity:0}to{opacity:1}}
.sys-wrap{display:flex;flex-direction:column;gap:12px}
.sys-btn{font-family:inherit;font-size:15px;letter-spacing:.18em;padding:13px;border-radius:14px;border:1px solid rgba(255,255,255,.8);background:rgba(255,255,255,.65);color:var(--ink);cursor:pointer;transition:transform .15s, background .15s}
.sys-btn:hover{transform:translateX(4px);background:rgba(255,240,246,.95)}
.set-wrap{display:flex;flex-direction:column;gap:16px}
.set-row{display:flex;align-items:center;justify-content:space-between;gap:14px;font-size:14px;letter-spacing:.1em}
.set-row input[type=range]{flex:1;max-width:260px;accent-color:#ff8fb3}
.quality-group{display:flex;gap:8px}
.qbtn{font-family:inherit;font-size:13px;padding:7px 16px;border-radius:99px;border:1px solid rgba(120,90,140,.25);background:rgba(255,255,255,.6);color:var(--ink);cursor:pointer}
.qbtn.on{background:linear-gradient(120deg,#ff8fb3,#b8a8ff);color:#fff;border-color:transparent}
.slot-list{display:flex;flex-direction:column;gap:12px}
.slot{display:flex;gap:14px;align-items:center;padding:12px;border-radius:16px;border:1px solid rgba(120,90,140,.16);background:rgba(255,255,255,.55);cursor:pointer;transition:transform .15s, background .15s}
.slot:hover{transform:translateY(-2px);background:rgba(255,255,255,.9)}
.slot-thumb{width:112px;height:64px;border-radius:10px;overflow:hidden;background:rgba(120,90,140,.1);flex:none}
.slot-thumb img{width:100%;height:100%;object-fit:cover}
.slot-info{font-size:13px;line-height:1.7;color:var(--ink-soft)}
.slot-title{color:var(--ink);font-weight:700;letter-spacing:.08em}
.slot-time{font-size:11px}
.slot-stats{font-size:11px;color:var(--purple)}
.slot-empty{color:var(--ink-soft);opacity:.7}
.history{display:flex;flex-direction:column;gap:10px;font-size:13px;line-height:1.75}
.hist-line{display:flex;gap:10px;padding:6px 0;border-bottom:1px dashed rgba(120,90,140,.14)}
.h-name{flex:none;font-weight:700;letter-spacing:.08em;min-width:64px}
.h-text{color:var(--ink-soft)}
.h-empty{color:var(--ink-soft);text-align:center;padding:30px 0}
.credits-list{display:flex;flex-direction:column;gap:14px;text-align:center;padding:10px 0}
.cr-row{display:flex;flex-direction:column;gap:4px}
.cr-row span{font-size:12px;color:var(--ink-soft);letter-spacing:.3em}
.cr-row b{font-size:15px;letter-spacing:.1em}

/* ---------- ending ---------- */
#ending{position:fixed;inset:0;z-index:80;display:flex;align-items:center;justify-content:center;background:rgba(10,8,25,.15);animation:fadein .8s ease}
.end-inner{display:flex;flex-direction:column;align-items:center;gap:20px;max-width:min(720px,90vw);padding:44px 40px;border-radius:24px;background:rgba(25,22,50,.55);border:1px solid rgba(255,255,255,.18);backdrop-filter:blur(8px);box-shadow:0 20px 60px rgba(10,10,30,.35);text-align:center;color:#fff}
.end-sub{font-size:clamp(11px,1.6vw,15px);letter-spacing:.6em;color:rgba(255,255,255,.75)}
.end-title{font-size:clamp(24px,5vw,44px);font-weight:700;letter-spacing:.18em;background:linear-gradient(120deg,#ffd9e8,#c9b8ff,#bfe0ff);-webkit-background-clip:text;background-clip:text;color:transparent}
.end-desc{font-size:clamp(12px,1.8vw,16px);line-height:2.1;color:rgba(255,255,255,.85);letter-spacing:.06em}
#ending .mm-btn{margin-top:10px}

/* ---------- joystick ---------- */
#joy{position:fixed;left:26px;bottom:26px;width:110px;height:110px;border-radius:50%;background:rgba(255,255,255,.22);border:1.5px solid rgba(255,255,255,.5);backdrop-filter:blur(6px);z-index:45;touch-action:none}
#joy-knob{position:absolute;left:50%;top:50%;width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.75);box-shadow:0 4px 12px rgba(0,0,0,.18);transform:translate(-50%,-50%);transition:transform .05s linear}

/* ---------- pointer-lock dot ---------- */
#look-dot{position:fixed;left:50%;top:50%;width:6px;height:6px;margin:-3px 0 0 -3px;border-radius:50%;background:rgba(255,255,255,.85);box-shadow:0 0 6px rgba(0,0,0,.35);pointer-events:none;z-index:45}

@media (max-width:760px){
  .mm-inner{padding:30px 26px}
  #dialog{padding:14px 16px;min-height:96px}
  #dialog-portrait{width:64px;height:64px}
  #choices{bottom:150px}
  .chip{top:12px;left:12px}
  .round-btn{top:12px;right:12px}
}
</style>
</head>

const STORY = {"meta": {"title": "夏色物語 ～忘れられた約束～", "subtitle": "Summer Chronicle: The Forgotten Promise", "version": "1.0", "start": "p00", "i18n": true, "chapters": [{"id": "c0", "name": "序章「放課後の桜」", "time": "afternoon"}, {"id": "c1", "name": "第1章「旧校舎の噂」", "time": "sunset"}, {"id": "c2", "name": "第2章「消えゆく夏」", "time": "dusk"}, {"id": "c3", "name": "第3章「約束の夏祭り」", "time": "night"}, {"id": "c4", "name": "結末", "time": "night"}]}, "chars": {"narr": {"name": "", "color": "#9fb0bd"}, "you": {"name": "あなた", "color": "#8fc3ff"}, "yui": {"name": "桜井 結衣", "color": "#ff8fb3"}, "saku": {"name": "篠原 朔", "color": "#a7b8ff"}}, "locs": {"classroom": {"name": "2年A組教室", "cam": [[0, 2.4, -2.2], [0, 1.6, 0]], "shot": [[0, 2.4, 2.2], [0, 1.8, 0]]}, "schoolyard": {"name": "校庭", "cam": [[-6, 2.6, 6], [0, 1.6, -2]], "shot": [[-5, 2.4, 5], [0, 2.0, -2]]}, "courtyard": {"name": "中庭", "cam": [[-5, 2.6, 6], [0, 1.5, -2]], "shot": [[-4.5, 2.4, 5], [0, 2.0, -2]]}, "library": {"name": "図書室", "cam": [[-5, 2.4, 6], [0, 1.8, 0]], "shot": [[-4.2, 2.2, 5], [0, 2.0, 0]]}, "oldschool": {"name": "旧校舎", "cam": [[5.5, 2.8, 7], [0, 1.8, -3]], "shot": [[5, 2.6, 6], [0, 2.0, -3]]}, "tower": {"name": "時計塔", "cam": [[-4, 3.2, 5], [0, 2.4, 0]], "shot": [[-3.5, 2.8, 4.5], [0, 2.4, 0]]}, "festival": {"name": "夏祭り会場", "cam": [[-6, 2.8, 7], [0, 1.6, -4]], "shot": [[-5, 2.6, 6], [0, 2.0, -4]]}}, "hotspots": {"note": {"loc": "classroom", "chaps": ["c1", "c2"], "label": "結衣のノート", "story": "o_note1", "off": [0.5, 0.5]}, "cat": {"loc": "schoolyard", "chaps": ["c1", "c2"], "label": "校庭の猫", "story": "o_cat1", "off": [3, 4]}, "sakura": {"loc": "schoolyard", "chaps": ["c1", "c2"], "label": "桜の木", "story": "o_sakura1", "off": [4.8, 3.0]}, "pond": {"loc": "courtyard", "chaps": ["c1", "c2"], "label": "中庭の池", "story": "o_pond1", "off": [2.0, 0.6]}, "books": {"loc": "library", "chaps": ["c2"], "label": "古い本棚", "story": "o_books1", "off": [0.5, 2]}, "diary": {"loc": "oldschool", "chaps": ["c2"], "label": "時計塔の床板", "story": "o_diary1", "off": [-4, -1]}}, "nodes": {"p00": {"loc": "classroom", "chap": "c0", "bgm": "day", "speaker": "narr", "text": "七月。梅雨刚过，蝉鸣声几乎要把教室的窗户震碎。\n期末考试结束的下午，放学的铃声早就响过了——走廊上，一个人也没有。", "next": "p01"}, "p01": {"speaker": "narr", "text": "可是，2年A组的教室里，还有一个女孩，坐在窗边不肯走。\n她在等你。她等了一整个下午。", "next": "p02"}, "p02": {"speaker": "yui", "expr": "happy", "text": "——啊，你还在呀！太好了！……嗯，不对。应该说，我从昨天开始，就在等你了。", "next": "p03"}, "p03": {"speaker": "yui", "expr": "excited", "text": "听我说听我说！旧校舎下个月就要拆掉了——你知道这件事吗？！", "next": "p04"}, "p04": {"speaker": "narr", "text": "她「砰」地撑在你面前的课桌上，眼睛亮得吓人。", "choices": [{"t": "嗯，听说是要建新的教学楼。", "next": "p05", "fx": {"yui": 1}, "hint": "結衣の好感度 +1"}, {"t": "是吗。反正，和我没什么关系。", "next": "p06"}, {"t": "你想说的，应该不只是这个吧。", "next": "p07"}]}, "p05": {"speaker": "yui", "expr": "happy", "text": "对对！就是那个！……可是，大家都说，那座楼太旧了，留着也是浪费。\n我不这么觉得。那座塔里，一定藏着什么了不得的东西。", "next": "p08"}, "p06": {"speaker": "yui", "expr": "soft", "text": "呜，好冷淡……不过算了。反正我的话说完了，你也还是会听的，对吧？\n……我说真的，我有一种预感——那座塔，和我们今年的夏天，有很大的关系。", "next": "p08"}, "p07": {"speaker": "yui", "expr": "excited", "text": "被你发现啦！……其实，那座时钟塔里，有个传说。\n据说，夏祭りの夜晚，对着那座钟许愿——时间就会停下来，为你实现愿望。", "next": "p08"}, "p08": {"speaker": "yui", "expr": "shy", "text": "所以呀……我想，在它被拆掉之前，去看看那座钟塔。\n……你、你愿意，陪我一起去吗？", "next": "p09"}, "p09": {"speaker": "narr", "text": "她少见地扭扭捏捏起来，手指绕着裙摆，转了一圈又一圈。", "choices": [{"t": "当然，我陪你去。", "next": "p10", "fx": {"yui": 1}, "hint": "結衣の好感度 +1"}, {"t": "……好是好，但别惹麻烦哦。", "next": "p10"}]}, "p10": {"speaker": "yui", "expr": "happy", "text": "太好了！那就约好了——明天下午三点，校门口见！\n……嗯，就这么说定了哦！", "next": "p11"}, "p11": {"speaker": "narr", "text": "她朝你挥挥手，像一只终于等到同伴的燕子，轻快地飞出教室。\n你不知道的是——这个夏天，会变成你一生中，最重要、也最漫长的那个夏天。"}, "p20": {"loc": "schoolyard", "chap": "c1", "bgm": "day", "speaker": "narr", "text": "第二天，下午三点。太阳毒辣辣的，校门的樱树上，蝉叫得撕心裂肺。\n她比约定时间早了十分钟，已经在树荫下等你。", "next": "p21"}, "p21": {"speaker": "yui", "expr": "happy", "text": "嗨——！很准时！……嗯？怎么一脸紧张？又不是去什么幽灵古堡……\n虽然，确实很像啦！", "next": "p22"}, "p22": {"speaker": "saku", "expr": "neutral", "text": "……你们，是要去旧校舎吗？", "next": "p23"}, "p23": {"speaker": "yui", "expr": "shocked", "text": "哇啊！朔学长？！你什么时候站在这的！吓死我了……", "next": "p24"}, "p24": {"speaker": "saku", "expr": "neutral", "text": "图书室在整理旧档案，我路过。……旧校舎，最好还是不要去。\n那座钟塔的钟，已经停了十年了。", "next": "p25"}, "p25": {"speaker": "narr", "text": "三年级的篠原朔——图书委员，说话总是慢半拍，可每一句，都像在提醒你什么。", "choices": [{"t": "为什么，停了十年？", "next": "p26"}, {"t": "……你是在这里巡岗的幽灵吗？", "next": "p27"}, {"t": "放心，我们会小心的。", "next": "p28"}]}, "p26": {"speaker": "saku", "expr": "quiet", "text": "十年前，最后一位守塔人去世以后，就再没有人给它上过发条。\n……不过，比起那座钟，我更担心的是别的。总之——别碰那座钟。", "next": "p29"}, "p27": {"speaker": "saku", "expr": "neutral", "text": "……比幽灵更麻烦的东西，也说不定。\n……算了，既然你们要去，我也拦不住。总之——别碰那座钟。", "next": "p29"}, "p28": {"speaker": "yui", "expr": "happy", "text": "朔学长也太爱操心了！不过……谢谢你担心我们！", "next": "p29"}, "p29": {"speaker": "saku", "expr": "quiet", "text": "……嗯。需要帮忙的话，来图书室找我。\n祝你们……能找到想找的东西。", "next": "p30"}, "p30": {"loc": "oldschool", "speaker": "narr", "text": "旧校舎的门没有锁，一推就开了。\n午后的阳光斜斜地落进空荡荡的走廊，灰尘在光柱里慢慢浮游。墙上的校报，还停留在十年前——「时钟塔维修中，预计暑期完工」。", "next": "p31"}, "p31": {"speaker": "yui", "expr": "curious", "text": "好安静……好像，声音都被这座楼吃掉了。", "next": "p32"}, "p32": {"speaker": "narr", "text": "走廊尽头，一道旋转楼梯盘旋而上。风从塔顶的缝隙漏下来，带着铁锈和旧木头的气味。", "next": "p33"}, "p33": {"speaker": "yui", "expr": "nervous", "text": "要、要上去吗？……说真的，我有点紧张了。", "next": "p34"}, "p34": {"speaker": "narr", "text": "楼梯又陡又暗。她站在楼梯口，朝上望了一眼，又退回来半步。", "choices": [{"t": "害怕的话，就牵着我的手。", "next": "p35", "fx": {"yui": 1, "courage": 1}, "hint": "結衣の好感度 +1　勇気 +1"}, {"t": "害怕的话，你在这里等我。", "next": "p36"}, {"t": "说实话……我也有点怕。", "next": "p37"}]}, "p35": {"speaker": "yui", "expr": "shy", "text": "！……笨、笨蛋！谁、谁要牵你的手啊……\n（嘴上这么说着，你的衣角，却被她悄悄揪住了。）", "next": "p38"}, "p36": {"speaker": "yui", "expr": "shy", "text": "谁、谁说我要等了！要走，就一起走！\n……你、你可不许半路放开哦。", "next": "p38"}, "p37": {"speaker": "yui", "expr": "happy", "text": "你也会怕呀……那正好。我数一二三，我们一起跑上去！\n一、二——！", "next": "p38"}, "p38": {"loc": "tower", "speaker": "narr", "text": "塔顶。落满灰尘的巨大座钟，安静地站在正中央。\n指针，停在零点。窗口的风铃被风吹动，叮——地响了一声。", "next": "p39"}, "p39": {"speaker": "yui", "expr": "soft", "text": "……你知道吗。我奶奶说过，这座钟里，住着「时间」。\n她说，夏祭りの夜里，站在钟前许愿——时间就会停下来，为你实现愿望。", "next": "p40"}, "p40": {"speaker": "yui", "expr": "soft", "text": "她说，她年轻的时候，亲眼见过一次。\n……她说，那座钟停下来的那个晚上，是全世界最安静、也最温柔的晚上。", "next": "p41"}, "p41": {"speaker": "narr", "text": "你看着她。她不是在讲故事——她是真的相信这些。\n就像她相信夏天、相信花火、相信约定。", "next": "p42"}, "p42": {"speaker": "narr", "text": "风从塔顶的破窗里灌进来，扬起她额前的碎发。", "choices": [{"t": "你相信那座钟吗？", "next": "p43"}, {"t": "……你该不会，有什么想许的愿望吧？", "next": "p44", "fx": {"trust": 1}, "hint": "結衣の信頼 +1"}]}, "p43": {"speaker": "yui", "expr": "smile", "text": "嗯……我也不确定。只是，总觉得，时间对一些人来说，太不公平了。\n……就像有些事，一旦错过，就再也回不去了。", "next": "p45"}, "p44": {"speaker": "yui", "expr": "shocked", "text": "！……才、才没有呢！……总之，我只是想看看传说里的钟塔长什么样而已啦。\n……今天的事，就当是我们两个人的秘密哦。", "next": "p45"}, "p45": {"speaker": "narr", "text": "夕阳从窗口涌进来，把整座塔染成温暖的橘色。\n她站在光影的边缘，像一张被阳光晒透的旧照片。", "next": "p46"}, "p46": {"speaker": "yui", "expr": "smile", "text": "……走吧，太阳要下山了。\n明天见。——明天，也一起放学吧？"}, "p50": {"loc": "library", "chap": "c2", "bgm": "memory", "speaker": "narr", "text": "三天后，下午的图书室。朔把一叠发黄的报纸摊在桌上——那是十年前，夏祭り第二天的报纸。", "next": "p51"}, "p51": {"speaker": "saku", "expr": "neutral", "text": "……你来得正好。我查到了一些东西。", "next": "p52"}, "p52": {"speaker": "saku", "expr": "neutral", "text": "十年前夏祭り的晚上，时钟塔的钟，响了一整夜。\n第二天，旧校舎的守塔人——一位姓「桜井」的老人，就从镇上消失了。", "next": "p53"}, "p53": {"speaker": "saku", "expr": "quiet", "text": "更奇怪的是——那件事之后，那个夏天，镇上所有人的记忆里，都少了整整一天。\n谁也想不起来，那天晚上，自己做了什么。", "next": "p54"}, "p54": {"speaker": "narr", "text": "报纸上，守塔人的照片模糊不清。只有一行字，被反复摩挲得几乎看不清。", "choices": [{"t": "守塔人……姓桜井？", "next": "p55"}, {"t": "这和結衣有什么关系？", "next": "p55"}]}, "p55": {"speaker": "saku", "expr": "quiet", "text": "……你们班那位桜井結衣同学，也姓桜井。\n我并不是在怀疑她。只是——如果她打算做什么「了不得的事」，我大概，会想阻止她。", "next": "p56"}, "p56": {"speaker": "narr", "text": "你的手机亮了一下。結衣发来消息：「明天就是夏祭り了！记得我们的约定！(◕‿◕)」\n你想起那座钟，和她提起奶奶时，亮起来的眼睛。", "next": "p57"}, "p57": {"speaker": "narr", "text": "旧报纸上的字迹在灯光下微微发烫。你合上报纸，做了个决定。", "choices": [{"t": "去找結衣，当面问清楚。", "next": "p58"}, {"t": "再去旧校舎调查一下。", "next": "p59"}]}, "p58": {"speaker": "narr", "text": "你绕到校庭。她正站在樱树下，踮着脚，努力够着一只躲在树杈上的小猫。\n（你三两下把小猫咪接了下来。她抱着猫，开心得眼睛都亮了。）", "next": "p60"}, "p59": {"speaker": "narr", "text": "你回到旧校舎。在钟塔的地板下，你发现了一本用油布包着的日记——封面，写着「桜井」两个字。", "next": "p61"}, "p60": {"speaker": "yui", "expr": "happy", "text": "谢谢你！多亏你！……你看，它都不肯走呢。\n……嗯？等等，你的眼神，怎么怪怪的？", "next": "p62"}, "p61": {"speaker": "narr", "text": "日记里是这样写的——\n「我在这座塔里，停住过一次时间。那一次，是为了救一个跌进河里的孩子。时间恢复流动的时候，我忘记了——那个孩子，叫什么名字。」\n最后一页：「如果再停一次，大概，连我自己是谁，也会想不起来吧。可是，如果能救重要的人——」", "next": "p62"}, "p62": {"speaker": "yui", "expr": "worried", "text": "……你一直这样看着我，会让我觉得，好像做错了什么。\n……发生什么了？", "next": "p63"}, "p63": {"speaker": "narr", "text": "她抱着猫，站在午后的光里。你忽然意识到，自己可能，是唯一知道这件事的人。", "choices": [{"t": "結衣，你奶奶……是个什么样的人？", "next": "p64"}, {"t": "明天，你打算去那座钟塔吗？", "next": "p65"}]}, "p64": {"speaker": "yui", "expr": "sad", "text": "奶奶她，在我很小的时候就不在了。\n说来奇怪……我好像，连她的名字都想不起来了。明明，她是我最重要的人之一。\n明明，她好像，告诉过我一件很重要的事。", "next": "p66"}, "p65": {"speaker": "yui", "expr": "shocked", "text": "！……你、你怎么会——！\n……（她张了张嘴。最后，泄气地低下头，把脸埋进小猫的绒毛里。）", "next": "p66"}, "p66": {"speaker": "yui", "expr": "soft", "text": "……明天晚上，学生会会在祭り的最后，宣布旧校舎的拆除决定。\n如果，时间能停在那一瞬间……那个决定，就会变成「还没有发生」的事。", "next": "p67"}, "p67": {"speaker": "yui", "expr": "soft", "text": "那座钟塔，是奶奶留给我的、唯一的东西了。\n……我知道这很傻。可是，我真的，不想连和奶奶有关的最后一样东西，都失去。", "next": "p68"}, "p68": {"speaker": "yui", "expr": "sad", "text": "我骗不了你。所以……这件事，我只告诉你一个人。\n明天晚上，我会去那座钟塔。如果……如果你觉得我疯了，那也没关系。你只要，假装不知道就好。", "next": "p69"}, "p69": {"speaker": "narr", "text": "她说完，用力笑了一下，然后低下头，避开你的眼睛。\n风铃的声音，不知从哪里飘过来。很轻，很远。", "next": "p70"}, "p70": {"speaker": "narr", "text": "夕阳把她和猫的影子拉得很长。这个夏天，好像走到了最关键的岔路口。", "choices": [{"t": "我会和你一起去的。", "next": "p71", "fx": {"yui": 1}, "hint": "結衣の好感度 +1"}, {"t": "不许去。那太危险了。", "next": "p72"}, {"t": "……真的，非这样做不可吗？", "next": "p73"}]}, "p71": {"speaker": "yui", "expr": "tearful", "text": "……嗯！我就知道！\n……我就知道，你会这么说。谢谢你，真的，谢谢你。", "next": "p74"}, "p72": {"speaker": "yui", "expr": "sad", "text": "……可是，我已经没有别的办法了。\n……就算你拦着我，明天，我也会一个人去的。……所以，求你了，别拦我。", "next": "p74"}, "p73": {"speaker": "yui", "expr": "sad", "text": "我也不知道……但是，如果连试都不试，我大概，会后悔一辈子。\n……奶奶她，一定也是这么想的。", "next": "p74"}, "p74": {"speaker": "narr", "text": "远处的祭り会场，传来花火试放的闷响。\n砰——地一声，像谁在天空里，轻轻敲了一下门。\n……明天，就是夏祭り了。"}, "p80": {"loc": "festival", "chap": "c3", "bgm": "festival", "speaker": "narr", "text": "夏祭りの夜。灯笼一盏接一盏，把长街照成温暖的金色。\n章鱼烧、捞金鱼、面具摊……整个世界，都热闹得不像话。", "next": "p81"}, "p81": {"speaker": "yui", "expr": "shy", "text": "……怎么样？浴衣……还可以吧？\n我挑了好久呢。", "next": "p82"}, "p82": {"speaker": "narr", "text": "烟火气、灯笼光、人声鼎沸。她站在这一切中间，安静地等着你的回答。", "choices": [{"t": "很漂亮。很适合你。", "next": "p83", "fx": {"yui": 1}, "hint": "結衣の好感度 +1"}, {"t": "嗯……和平时，不太一样。", "next": "p83"}]}, "p83": {"speaker": "yui", "expr": "happy", "text": "嘿嘿，这可是我逛了三个摊子才决定的！……走吧走吧，先捞金鱼！\n……反正，时间还——（她忽然收声，望向旧校舎的方向。）", "next": "p84"}, "p84": {"speaker": "yui", "expr": "soft", "text": "……走吧。先去玩个够。然后……我们一起，去完成那件事。", "next": "p85"}, "p85": {"speaker": "narr", "text": "你跟着她，在人潮里穿行。远处旧校舎的轮廓，沉默地立在夜色中。\n你几乎可以肯定——那座塔顶的钟，刚刚，亮了一下。", "next": "p86"}, "p86": {"speaker": "narr", "text": "她走在你前面半步。灯笼的光落在她肩头，随着人潮一起一伏。", "choices": [{"t": "……結衣，我们不去钟塔了，好不好？", "next": "p87"}, {"t": "走吧。我陪你去。", "next": "p88", "fx": {"trust": 1}, "hint": "結衣の信頼 +1"}]}, "p87": {"speaker": "yui", "expr": "smile", "text": "……诶？你是在担心我吗？\n……谢谢你。不过啊，有些约定，是不能违约的。\n走吧。别让我一个人。", "next": "p88"}, "p88": {"loc": "tower", "speaker": "narr", "text": "钟塔里。楼梯很暗，只有远处祭り的灯光，从窗缝漏进来。\n她的脚步声，比平时更轻、更稳。", "next": "p89"}, "p89": {"speaker": "yui", "expr": "soft", "text": "站在钟前，在心里说出愿望，就可以。\n……奶奶说，钟声会替你把愿望，送去给时间听。", "next": "p90"}, "p90": {"speaker": "narr", "text": "她转过身，向你伸出手。灯火从她身后漏进来，她整个人都罩着一层毛茸茸的光。\n她握住你的手——她手心的温度，和平时一样。", "next": "p91"}, "p91": {"speaker": "narr", "text": "午夜将至。远处祭り的钟楼，开始敲响。……再不决定，就来不及了。", "choices": [{"t": "（反握住她的手，站在她身边。）", "next": "p92", "fx": {"courage": 1}, "hint": "勇気 +1"}, {"t": "（轻轻，松开了她的手。）", "next": "p93"}]}, "p92": {"speaker": "yui", "expr": "tearful", "text": "……嗯。你在的话，我就不怕了。\n……那，我开始了。", "next": "p94"}, "p93": {"speaker": "yui", "expr": "sad", "text": "……诶？……啊，嗯。……也是呢。\n没关系。我一个人，也可以的。", "next": "p94"}, "p94": {"speaker": "narr", "text": "她闭上眼。\n咚——咚——咚——……远处祭り的钟楼，敲响了十二下。\n第十二声落下的瞬间，全世界，都安静了。", "next": "p95"}, "p95": {"speaker": "narr", "text": "钟塔的指针，开始倒转。风铃一声接一声，像倒带。\n她飘扬的头发、裙摆、扬起的衣角——全部，静止在了半空中。", "next": "p96"}, "p96": {"speaker": "yui", "expr": "happy", "text": "（她睁开眼，看着你，笑得很轻。）\n……你看。时间，停住了。", "next": "p97"}, "p97": {"speaker": "narr", "text": "世界凝固成一片琥珀。只有你们两个人，还能在时间里行走。\n……可是，她望着你的笑容，忽然，开始变得透明。", "next": "p98"}, "p98": {"speaker": "yui", "expr": "shocked", "text": "……咦？我的、手……？", "next": "p99"}, "p99": {"speaker": "narr", "text": "你想起那本日记——「如果再停一次，大概，连我自己是谁，也会想不起来吧。」\n你终于明白，她从一开始，就知道会发生什么。", "next": "p99end"}, "p99end": {"if": "yui\u003e=5 && trust\u003e=2 && f.diary", "yes": "t01", "no": "t99b"}, "t99b": {"if": "yui\u003e=3", "yes": "n01", "no": "b01"}, "t01": {"loc": "tower", "chap": "c4", "bgm": "memory", "speaker": "yui", "expr": "soft", "text": "……不要露出那种表情啦。\n旧校舎会得救的，大家的夏天，也会留在今天。……只要付出这一点点代价，不是很划算吗？", "next": "t02"}, "t02": {"speaker": "yui", "expr": "tearful", "text": "忘掉你的名字什么的……也没关系。\n……咦，奇怪。我明明还没有忘记呢，眼泪怎么就……自己掉下来了。", "next": "t03"}, "t03": {"speaker": "narr", "text": "她抬起手，想擦掉眼泪——可是她的手，已经透明得能看见钟面了。", "choices": [{"t": "不行。我不允许你忘记。", "next": "t04", "fx": {"courage": 1}, "hint": "勇気 +1"}, {"t": "……别哭。你还有我在。", "next": "t04"}]}, "t04": {"speaker": "narr", "text": "你握住她那双透明的手，闭上眼，在心里，向那座钟，说出你的愿望。", "next": "t05"}, "t05": {"speaker": "narr", "text": "「如果时间要收取代价——那就把我的记忆，也一并拿去吧。\n这个夏天的约定，我一个人记住，就够了。」", "next": "t06"}, "t06": {"speaker": "narr", "text": "钟声——铛——地响彻了整座塔。世界像被按下了倒带，飞速向后倒流。\n然后，猛地停住。烟花，在夜空中炸开。时间，重新开始走动。", "next": "t07"}, "t07": {"speaker": "yui", "expr": "shocked", "text": "！……你、你做了什么？！\n我的记忆……还在……可是，为什么，我好像多了一段——关于「你」的记忆？", "next": "t08"}, "t08": {"speaker": "narr", "text": "你记得全部。包括她自己，都已经忘记的那个夏天。\n你们交换过的约定、看过的花火、说过的话——从今以后，都由你一个人，替她保管。", "next": "t09"}, "t09": {"speaker": "yui", "expr": "tearful", "text": "（她用力擦掉眼泪，然后抬起头，像夏天一样，用力地笑起来。）\n……那就说好了哦。每个夏天，都要一起看花火。\n这份约定，你一辈子，都不许忘。", "next": "t10"}, "t10": {"speaker": "narr", "text": "后来——旧校舎没有拆除。据说，那张「拆除通知」，在最后一刻，被换成了一张「修缮通知」。镇上的大人，谁也说不清是谁递的。\n而那座钟塔的钟，从那以后，走得比镇上任何一座钟都准。\n……哦，对了。听说钟塔的窗口，从此多了一串风铃。风铃上，刻着两个名字。", "ending": {"title": "真結末「刻在风铃上的约定」", "sub": "夏色物語 ～忘れられた約束～", "desc": "被你记住的约定，会成为永不消逝的夏天。結衣の好感度 MAX"}}, "n01": {"loc": "tower", "chap": "c4", "bgm": "memory", "speaker": "yui", "expr": "happy", "text": "太好了……旧校舎，得救了。\n时间停下来的这个晚上，什么都不会改变。……明天，太阳升起来的时候，这个夏天，就圆满地结束了。", "next": "n02"}, "n02": {"speaker": "yui", "expr": "soft", "text": "……谢谢你，陪我来。\n要是没有你在，我大概，没有勇气站在这里。", "next": "n03"}, "n03": {"speaker": "yui", "expr": "tearful", "text": "所以呀——明天的花火，也一起去看吧？\n……不对，是明年的花火。……不，是「每年」的花火。嘿嘿。", "next": "n04"}, "n04": {"speaker": "narr", "text": "零点零一分。钟声再次响起，时间恢复流动。\n烟花在夜空炸开，照亮她仰起的脸。她的眼睛里，倒映着整个夏天的星光。", "next": "n05"}, "n05": {"speaker": "narr", "text": "夏祭り过后，旧校舎的拆除通知被撤销了——理由是「程序上的错误」。\n只有你知道，那个夏天，你们一起，让时间停了一整夜。", "next": "n06"}, "n06": {"speaker": "yui", "expr": "happy", "text": "来年も、またね！……啊，不对——\n明年的夏天，也一起去看花火吧！约定好了哦！", "ending": {"title": "普通結末「夏の終わりに、約束を」", "sub": "夏色物語 ～忘れられた約束～", "desc": "时间停了一夜，约定留了一生。这是一个温柔的、完整的夏天。"}}, "b01": {"loc": "tower", "chap": "c4", "bgm": "tension", "speaker": "yui", "expr": "sad", "text": "（她的声音，变得很远很远。）\n……对不起……我好像，忘记了什么很重要的事……\n很重要的、约定……", "next": "b02"}, "b02": {"speaker": "yui", "expr": "shocked", "text": "你的名字……是……？\n……啊，对不起。我们……认识吗？", "next": "b03"}, "b03": {"speaker": "narr", "text": "世界重新开始流动。烟花、人群、笑声——一切都和刚才一样。\n只有她，站在你面前，用看陌生人的眼神，看着你。", "next": "b04"}, "b04": {"speaker": "narr", "text": "而更可怕的是——你忽然发现，你自己也想不起来，为什么，你会站在这里。", "next": "b05"}, "b05": {"speaker": "yui", "expr": "neutral", "text": "……那个，同学。这座塔很危险哦。\n祭り，就快结束了，还是下去吧。", "next": "b06"}, "b06": {"speaker": "narr", "text": "你一个人站在塔顶。风铃——叮——地响了一声。\n你低下头，发现手心里攥着一张字条，字迹歪歪扭扭：\n「每年夏天，都要来看花火哦。一定。」\n——而这个夏天，大概，会一遍又一遍地重来。直到有一天，你们中的谁，先想起来。", "ending": {"title": "悲しき結末「繰り返す夏」", "sub": "夏色物語 ～忘れられた約束～", "desc": "被遗忘的约定，会在时间里打转。试试不同的选择，把这个夏天，救回来吧。"}}, "o_note1": {"speaker": "narr", "text": "教室里空无一人。你在結衣的课桌里，看到一本摊开的笔记本。", "next": "o_note2"}, "o_note2": {"speaker": "narr", "text": "「夏祭りまで あと◯日。」\n「钟塔的事情……一定要告诉他。可是，他会相信吗？」", "next": "o_note3"}, "o_note3": {"speaker": "narr", "text": "你轻轻合上笔记本。那行字下面，还画着一颗小小的星星。", "fx": {"yui": 1}, "hint": "結衣の好感度 +1"}, "o_cat1": {"speaker": "yui", "expr": "happy", "text": "你看！那只猫又来了！……它每天下午都在这，好像，在等什么人。", "next": "o_cat2"}, "o_cat2": {"speaker": "narr", "text": "你摸了摸口袋——里面居然有一包小鱼干，也不知道是谁放的。\n小猫吃得心满意足，蹭了蹭結衣的脚踝。", "next": "o_cat3"}, "o_cat3": {"speaker": "yui", "expr": "happy", "text": "嘿嘿，被猫蹭到，是会有好事发生的哦！\n……今天，一定会有好事发生的！", "fx": {"yui": 1}, "hint": "結衣の好感度 +1"}, "o_sakura1": {"speaker": "narr", "text": "校庭的樱树，是镇上最老的树。\n树根下的泥土里，埋着你们小时候的时光胶囊。", "next": "o_sakura2"}, "o_sakura2": {"speaker": "narr", "text": "「给十年后的自己：希望我们，还是最好的朋友。」\n——落款，是两个歪歪扭扭的名字。你把它放回了原处。", "fx": {"yui": 1}, "hint": "結衣の好感度 +1"}, "o_pond1": {"speaker": "narr", "text": "中庭的小池子，映着整片天空。\n你摸出一枚硬币——（噗通）——向着旧校舎的钟塔方向，许了个愿。", "next": "o_pond2"}, "o_pond2": {"speaker": "narr", "text": "水面的涟漪，一圈一圈地荡开。\n像某个人，在很远很远的地方，轻轻笑了。"}, "o_books1": {"speaker": "saku", "expr": "quiet", "text": "……你来了。那本书，我帮你留好了。", "next": "o_books2"}, "o_books2": {"speaker": "narr", "text": "《时钟塔的传说》。书页里，夹着一张泛黄的照片——\n一位老人，抱着一个扎着马尾的小女孩。照片背面写着：「给小結衣：夏祭り那天，一定给你放最漂亮的花火。」"}, "o_diary1": {"speaker": "narr", "text": "钟塔的地板下，有一块松动的木板。你轻轻掀开——\n里面躺着一本用油布包着的日记。封面，写着「桜井」。", "next": "o_diary2"}, "o_diary2": {"speaker": "narr", "text": "「我在这座塔里，停住过一次时间。那一次，是为了救一个跌进河里的孩子。\n时间恢复流动的时候，我忘记了——那个孩子，叫什么名字。」\n……最后一页：「如果再停一次，大概，连我自己是谁，也会想不起来吧。可是——」", "next": "o_diary3"}, "o_diary3": {"speaker": "narr", "text": "你合上日记，把它放回原处，装作从来没有发现过它。", "fx": {"yui": 1, "flags": {"diary": true}}, "hint": "結衣の好感度 +1　（得到了「日记」的情报）"}}};
const SAVE_PREFIX = 'sc_';
const SETTINGS_KEY = 'sc_settings';
const DEFAULT_SETTINGS = { bgm: 0.7, sfx: 0.8, quality: 'high', textSpeed: 1, fullscreen: false };
let SETTINGS = Object.assign({}, DEFAULT_SETTINGS);

function loadSettings() {
  try {
    const raw = localStorage.getItem(SETTINGS_KEY);
    if (raw) SETTINGS = Object.assign({}, DEFAULT_SETTINGS, JSON.parse(raw));
  } catch (e) {}
}
function saveSettings() {
  try { localStorage.setItem(SETTINGS_KEY, JSON.stringify(SETTINGS)); } catch (e) {}
}

function fmtTime(ts) {
  const d = new Date(ts);
  const p = n => (n < 10 ? '0' + n : '' + n);
  return p(d.getMonth() + 1) + '/' + p(d.getDate()) + ' ' + p(d.getHours()) + ':' + p(d.getMinutes());
}

const COND_TOKEN = /\(|\)|&&|\|\||!|>=|<=|==|!=|>|<|\b(?:true|false)\b|\b\d+\b|\b[a-zA-Z]\w*|\./g;
function tokenizeCond(src) {
  const out = [];
  let m;
  COND_TOKEN.lastIndex = 0;
  while ((m = COND_TOKEN.exec(src))) out.push(m[0]);
  return out;
}
function condValue(node) {
  if (node === 'true') return true;
  if (node === 'false') return false;
  if (/^\d+$/.test(node)) return parseInt(node, 10);
  if (node === 'yui') return State.yui;
  if (node === 'trust') return State.trust;
  if (node === 'courage') return State.courage;
  if (node === 'f') return State.flags;
  return undefined;
}
function parseCond(expr) {
  const toks = tokenizeCond(expr);
  let pos = 0;
  const peek = () => toks[pos];
  const eat = t => { if (peek() !== t) throw new Error('cond parse: ' + expr); pos++; };
  function parseOr() {
    let left = parseAnd();
    while (peek() === '||') { eat('||'); const r = parseAnd(); left = left || r; }
    return left;
  }
  function parseAnd() {
    let left = parseUnary();
    while (peek() === '&&') { eat('&&'); const r = parseUnary(); left = left && r; }
    return left;
  }
  function parseUnary() {
    if (peek() === '!') { eat('!'); return !parseUnary(); }
    if (peek() === '(') { eat('('); const v = parseOr(); eat(')'); return v; }
    return parseAtom();
  }
  function parseAtom() {
    let l = condValue(peek());
    if (l === undefined) throw new Error('cond atom: ' + expr);
    pos++;
    if (peek() === '.') {
      pos++;
      const key = peek();
      pos++;
      if (l && typeof l === 'object') l = l[key];
      else l = undefined;
    }
    const op = peek();
    if (op === '==') { pos++; const r = condValue(peek()); pos++; return l === r; }
    if (op === '!=') { pos++; const r = condValue(peek()); pos++; return l !== r; }
    if (op === '>') { pos++; const r = condValue(peek()); pos++; return l > r; }
    if (op === '<') { pos++; const r = condValue(peek()); pos++; return l < r; }
    if (op === '>=') { pos++; const r = condValue(peek()); pos++; return l >= r; }
    if (op === '<=') { pos++; const r = condValue(peek()); pos++; return l <= r; }
    return !!l;
  }
  return { state: 0, value: 0, eval: function () { pos = 0; return parseOr(); } };
}
function evalCond(expr) {
  try {
    const p = parseCond(expr);
    return p.eval();
  } catch (e) {
    return false;
  }
}

function applyFx(fx) {
  if (!fx) return;
  if (fx.yui) State.yui += fx.yui;
  if (fx.trust) State.trust += fx.trust;
  if (fx.courage) State.courage += fx.courage;
  if (fx.flags) Object.assign(State.flags, fx.flags);
}

const midiF = m => 440 * Math.pow(2, (m - 69) / 12);
function nt(name) {
  const m = /^([A-G])([sb]?)(\d)$/.exec(name);
  const base = { C: 0, D: 2, E: 4, F: 5, G: 7, A: 9, B: 11 }[m[1]];
  const adj = m[2] === 's' ? 1 : m[2] === 'b' ? -1 : 0;
  return 12 * (parseInt(m[3], 10) + 1) + base + adj;
}

const AudioSys = {
  ctx: null,
  master: null,
  bgmBus: null,
  sfxBus: null,
  ambBus: null,
  curTrack: null,
  ambKind: null,
  ambientTimer: null,
  _noise: null,
  _ambSource: null,
  _clockNext: 0,
  _clockTicker: null,

  init() {
    if (this.ctx) return;
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    this.ctx = ctx;
    this.master = ctx.createGain();
    this.master.gain.value = 1;
    this.master.connect(ctx.destination);
    this.bgmBus = ctx.createGain();
    this.bgmBus.gain.value = 0.85;
    this.bgmBus.connect(this.master);
    this.sfxBus = ctx.createGain();
    this.sfxBus.gain.value = 1;
    this.sfxBus.connect(this.master);
    this.ambBus = ctx.createGain();
    this.ambBus.gain.value = 0.6;
    this.ambBus.connect(this.master);
    this.startClock();
  },
  resume() {
    if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume();
  },
  setVolumes(bgm, sfx) {
    this.bgmVol(bgm);
    this.sfxVol(sfx);
  },
  bgmVol(v, persist) {
    if (typeof v === 'number') {
      SETTINGS.bgm = Math.max(0, Math.min(1, v));
      if (persist) saveSettings();
    }
    if (this.ctx) this.bgmBus.gain.value = SETTINGS.bgm * 0.85;
  },
  sfxVol(v, persist) {
    if (typeof v === 'number') {
      SETTINGS.sfx = Math.max(0, Math.min(1, v));
      if (persist) saveSettings();
    }
    if (this.ctx) this.sfxBus.gain.value = SETTINGS.sfx;
  },
  startClock() {
    if (!this.ctx || this._clockTicker) return;
    const self = this;
    this._clockNext = this.ctx.currentTime + 0.2;
    this._clockTicker = setInterval(() => { try { self._tick(); } catch (e) {} }, 60);
  },
  _tick() {
    const tr = this.curTrack;
    if (!tr) return;
    const ahead = this.ctx.currentTime + 0.16;
    while (this._clockNext < ahead) {
      const beat = (this._clockNext - tr.startAt) * tr.bpm / 60;
      if (beat >= 0 && beat < tr.lenBeats) {
        const evs = tr.events[Math.floor(beat)];
        if (evs) for (const e of evs) this.voice(e.inst, this._clockNext, e.n, e.d, e.v);
      }
      this._clockNext += 0.16;
    }
  },

  voice(inst, t, n, d, v) {
    const tr = this.curTrack;
    if (!tr) return;
    const bus = tr.gain;
    const f = midiF(n);
    const secs = d * 60 / tr.bpm;
    if (inst === 'pluck') {
      const o = this.ctx.createOscillator(); o.type = 'triangle'; o.frequency.value = f;
      const o2 = this.ctx.createOscillator(); o2.type = 'sine'; o2.frequency.value = f * 2;
      const lp = this.ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 2600;
      const g = this.ctx.createGain();
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(v * 0.3, t + 0.012);
      g.gain.exponentialRampToValueAtTime(0.0001, t + Math.min(secs * 0.9, 1.4));
      const g2 = this.ctx.createGain(); g2.gain.value = 0.4;
      o.connect(lp); o2.connect(lp); lp.connect(g); g.connect(g2); g2.connect(bus);
      o.start(t); o2.start(t);
      o.stop(t + 1.6); o2.stop(t + 1.6);
    } else if (inst === 'pad') {
      const g = this.ctx.createGain();
      const lp = this.ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 800;
      g.gain.setValueAtTime(0.0001, t);
      g.gain.linearRampToValueAtTime(v * 0.16, t + 0.6);
      g.gain.setValueAtTime(v * 0.16, t + Math.max(secs * 0.7, 0.3));
      g.gain.linearRampToValueAtTime(0.0001, t + secs + 0.5);
      const voices = [f, f * 1.004, f / 2];
      const types = ['sawtooth', 'sawtooth', 'triangle'];
      for (let i = 0; i < 3; i++) {
        const o = this.ctx.createOscillator();
        o.type = types[i]; o.frequency.value = voices[i];
        o.connect(lp);
        o.start(t);
        o.stop(t + secs + 0.7);
      }
      lp.connect(g); g.connect(bus);
    } else if (inst === 'bass') {
      const o = this.ctx.createOscillator(); o.type = 'sine'; o.frequency.value = f;
      const o2 = this.ctx.createOscillator(); o2.type = 'triangle'; o2.frequency.value = f * 2.01;
      const lp = this.ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 600;
      const g = this.ctx.createGain();
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(v * 0.5, t + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t + secs * 0.96);
      const g2 = this.ctx.createGain(); g2.gain.value = 0.5;
      o.connect(lp); o2.connect(lp); lp.connect(g); g.connect(g2); g2.connect(bus);
      o.start(t); o2.start(t);
      o.stop(t + secs + 0.2); o2.stop(t + secs + 0.2);
    } else if (inst === 'bell') {
      this._bell(t, f, v, secs, bus);
    } else if (inst === 'drum') {
      const o = this.ctx.createOscillator(); o.type = 'sine';
      o.frequency.setValueAtTime(160, t);
      o.frequency.exponentialRampToValueAtTime(50, t + secs);
      const g = this.ctx.createGain();
      g.gain.setValueAtTime(v * 0.5, t);
      g.gain.exponentialRampToValueAtTime(0.0001, t + secs);
      o.connect(g); g.connect(bus);
      o.start(t); o.stop(t + secs + 0.1);
    } else if (inst === 'tick') {
      const o = this.ctx.createOscillator(); o.type = 'square'; o.frequency.value = 1900;
      const g = this.ctx.createGain();
      g.gain.setValueAtTime(v * 0.1, t);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 0.03);
      o.connect(g); g.connect(bus);
      o.start(t); o.stop(t + 0.04);
    }
  },
  _bell(t, f, v, dur, bus) {
    const ctx = this.ctx;
    const g = ctx.createGain();
    const lp = ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 5000;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(Math.max(0.0002, v), t + 0.008);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    const o1 = ctx.createOscillator(); o1.type = 'sine'; o1.frequency.value = f;
    const o2 = ctx.createOscillator(); o2.type = 'sine'; o2.frequency.value = f * 2.76;
    const o3 = ctx.createOscillator(); o3.type = 'sine'; o3.frequency.value = f * 4.1;
    const g2 = ctx.createGain(); g2.gain.value = 0.3;
    const g3 = ctx.createGain(); g3.gain.value = 0.12;
    o1.connect(lp); o2.connect(g2); g2.connect(lp); o3.connect(g3); g3.connect(lp);
    lp.connect(g); g.connect(bus);
    o1.start(t); o2.start(t); o3.start(t);
    o1.stop(t + dur + 0.1); o2.stop(t + dur + 0.1); o3.stop(t + dur + 0.1);
  },

  playBgm(name, force) {
    if (!this.ctx) return;
    if (this.curTrack && this.curTrack.name === name && !force) return;
    const cfg = TRACKS[name];
    if (!cfg) return;
    const ctx = this.ctx;
    const t0 = ctx.currentTime;
    if (this.curTrack) {
      const old = this.curTrack;
      const g = old.gain.gain;
      g.cancelScheduledValues(t0);
      g.setValueAtTime(Math.max(g.value, 0.0001), t0);
      g.linearRampToValueAtTime(0, t0 + 1.5);
      const oldGain = old.gain;
      setTimeout(() => { try { oldGain.disconnect(); } catch (e) {} }, 1900);
    }
    const gain = ctx.createGain();
    gain.gain.setValueAtTime(0.0001, t0);
    gain.gain.linearRampToValueAtTime(1, t0 + 1.5);
    gain.connect(this.bgmBus);
    const track = {
      name,
      bpm: cfg.bpm,
      lenBeats: cfg.lenBeats,
      events: cfg.events,
      startAt: t0 + 1.6,
      gain
    };
    this.curTrack = track;
    this._clockNext = Math.max(this._clockNext, t0 + 1.7);
  },
  stopBgm() {
    if (!this.ctx || !this.curTrack) return;
    const old = this.curTrack;
    const t = this.ctx.currentTime;
    const g = old.gain.gain;
    g.cancelScheduledValues(t);
    g.setValueAtTime(Math.max(g.value, 0.0001), t);
    g.linearRampToValueAtTime(0, t + 1.4);
    setTimeout(() => { try { old.gain.disconnect(); } catch (e) {} }, 1600);
    this.curTrack = null;
  },

  sfx(name, vol) {
    if (!this.ctx) return;
    const ctx = this.ctx;
    const t = ctx.currentTime;
    const v = typeof vol === 'number' ? vol : 1;
    const out = this.sfxBus;
    const s = name;
    if (s === 'click') {
      const o = ctx.createOscillator(); o.type = 'sine'; o.frequency.setValueAtTime(720, t); o.frequency.exponentialRampToValueAtTime(520, t + 0.06);
      const g = ctx.createGain(); g.gain.setValueAtTime(0.2 * v, t); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.09);
      o.connect(g); g.connect(out); o.start(t); o.stop(t + 0.1);
    } else if (s === 'hover') {
      const o = ctx.createOscillator(); o.type = 'sine'; o.frequency.value = 980;
      const g = ctx.createGain(); g.gain.setValueAtTime(0.06 * v, t); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.05);
      o.connect(g); g.connect(out); o.start(t); o.stop(t + 0.06);
    } else if (s === 'pop') {
      const o = ctx.createOscillator(); o.type = 'sine'; o.frequency.setValueAtTime(430, t); o.frequency.exponentialRampToValueAtTime(740, t + 0.1);
      const g = ctx.createGain(); g.gain.setValueAtTime(0.22 * v, t); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.16);
      o.connect(g); g.connect(out); o.start(t); o.stop(t + 0.18);
    } else if (s === 'page') {
      this._noiseSweep(out, t, 0.14, 0.1 * v, 3600, 900);
    } else if (s === 'chime') {
      this._bell(t, 1568, 0.18 * v, 1.3, out);
      this._bell(t + 0.09, 2093, 0.1 * v, 1.1, out);
    } else if (s === 'ring') {
      this._bell(t, 523, 0.16 * v, 2.2, out);
      this._bell(t + 0.2, 784, 0.12 * v, 1.8, out);
      this._bell(t + 0.4, 1046, 0.08 * v, 1.6, out);
    } else if (s === 'splash') {
      const lp = ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 1500;
      const src = ctx.createBufferSource(); src.buffer = this.noiseBuffer();
      const g = ctx.createGain(); g.gain.setValueAtTime(0.3 * v, t); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.6);
      src.connect(lp); lp.connect(g); g.connect(out); src.start(t);
      const o = ctx.createOscillator(); o.type = 'sine'; o.frequency.setValueAtTime(600, t); o.frequency.exponentialRampToValueAtTime(180, t + 0.4);
      const g2 = ctx.createGain(); g2.gain.setValueAtTime(0.18 * v, t); g2.gain.exponentialRampToValueAtTime(0.0001, t + 0.4);
      o.connect(g2); g2.connect(out); o.start(t); o.stop(t + 0.5);
    } else if (s === 'boom') {
      this._boom(t, out, v);
    } else if (s === 'burst') {
      this._noiseSweep(out, t, 0.45, 0.09 * v, 3200, 300);
      for (let i = 0; i < 6; i++) this._bell(t + i * 0.04, 1250 + Math.random() * 900, 0.035 * v, 0.5, out);
    } else if (s === 'step') {
      const lp = ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 450;
      const src = ctx.createBufferSource(); src.buffer = this.noiseBuffer();
      const g = ctx.createGain(); g.gain.setValueAtTime(0.045 * v, t); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.05);
      src.connect(lp); lp.connect(g); g.connect(out); src.start(t); src.stop(t + 0.06);
    } else if (s === 'coin') {
      const o = ctx.createOscillator(); o.type = 'sine'; o.frequency.setValueAtTime(880, t); o.frequency.exponentialRampToValueAtTime(1320, t + 0.09);
      const g = ctx.createGain(); g.gain.setValueAtTime(0.24 * v, t); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.22);
      o.connect(g); g.connect(out); o.start(t); o.stop(t + 0.24);
      for (let i = 0; i < 3; i++) this._bell(t + 0.02 + i * 0.05, 1500 + i * 240, 0.06 * v, 0.4, out);
    }
  },
  _noiseSweep(out, t, dur, vol, f0, f1) {
    const ctx = this.ctx;
    const lp = ctx.createBiquadFilter(); lp.type = 'lowpass';
    lp.frequency.setValueAtTime(f0, t);
    lp.frequency.exponentialRampToValueAtTime(f1, t + dur);
    const src = ctx.createBufferSource(); src.buffer = this.noiseBuffer();
    const g = ctx.createGain(); g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    src.connect(lp); lp.connect(g); g.connect(out); src.start(t); src.stop(t + dur + 0.05);
  },
  noiseBuffer() {
    if (this._noise) return this._noise;
    const len = Math.floor(this.ctx.sampleRate * 2);
    const buf = this.ctx.createBuffer(1, len, this.ctx.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    this._noise = buf;
    return buf;
  },

  startAmbient(kind) {
    if (this.ambKind === kind) return;
    this.ambKind = kind;
    if (this.ambientTimer) clearInterval(this.ambientTimer);
    if (this._ambSource) { try { this._ambSource.stop(); } catch (e) {} this._ambSource = null; }
    this.ambientTimer = null;
    if (!this.ctx) return;
    const self = this;
    if (kind === 'day') {
      this.ambientTimer = setInterval(() => { self.bird(); }, 3200 + Math.random() * 3200);
    } else if (kind === 'dusk') {
      this.ambientTimer = setInterval(() => { self.cricket(); }, 150 + Math.random() * 200);
    } else if (kind === 'night') {
      self.crowd();
      this.ambientTimer = setInterval(() => { if (Math.random() < 0.6) self.cricket(); }, 1600);
    } else if (kind === 'tower') {
      this.ambientTimer = setInterval(() => { self.chime(); }, 5500 + Math.random() * 4000);
    }
  },
  bird() {
    const ctx = this.ctx;
    const t = ctx.currentTime;
    const base = 2600 + Math.random() * 500;
    for (let i = 0; i < 3; i++) {
      const o = ctx.createOscillator(); o.type = 'sine';
      o.frequency.setValueAtTime(base, t + i * 0.09);
      o.frequency.exponentialRampToValueAtTime(base * (1.4 + Math.random() * 0.3), t + i * 0.09 + 0.07);
      const g = ctx.createGain(); g.gain.setValueAtTime(0.1, t + i * 0.09); g.gain.exponentialRampToValueAtTime(0.0001, t + i * 0.09 + 0.12);
      o.connect(g); g.connect(this.ambBus);
      o.start(t + i * 0.09); o.stop(t + i * 0.09 + 0.15);
    }
  },
  cricket() {
    const ctx = this.ctx;
    const t = ctx.currentTime;
    const o = ctx.createOscillator(); o.type = 'triangle'; o.frequency.value = 5200;
    const g = ctx.createGain(); g.gain.setValueAtTime(0.04, t); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.04);
    o.connect(g); g.connect(this.ambBus);
    o.start(t); o.stop(t + 0.05);
  },
  chime() {
    this._bell(this.ctx.currentTime, 2093, 0.04, 1.8, this.ambBus);
  },
  crowd() {
    const ctx = this.ctx;
    const t = ctx.currentTime;
    const src = ctx.createBufferSource(); src.buffer = this.noiseBuffer(); src.loop = true;
    const lp = ctx.createBiquadFilter(); lp.type = 'bandpass'; lp.frequency.value = 750; lp.Q.value = 0.4;
    const g = ctx.createGain(); g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(0.05, t + 0.8);
    src.connect(lp); lp.connect(g); g.connect(this.ambBus);
    src.start(t);
    this._ambSource = src;
  }
};

const TRACKS = {};

function buildTracks() {
  TRACKS.day = (function () {
    const events = {};
    const lenBeats = 32;
    const push = (b, inst, n, d, v) => {
      const beat = Math.floor(b);
      if (!events[beat]) events[beat] = [];
      events[beat].push({ name: inst, n, d, v });
    };
    const C = [nt('C4'), nt('E4'), nt('G4')];
    const G = [nt('G3'), nt('B3'), nt('D4')];
    const Am = [nt('A3'), nt('C4'), nt('E4')];
    const F = [nt('F3'), nt('A3'), nt('C4')];
    const bars = [C, G, Am, F, C, G, F, G];
    for (let b = 0; b < 8; b++) {
      const ch = bars[b];
      const r = b * 4;
      push(r, 'bass', ch[0] - 12, 3.8, 0.4);
      const offs = [0, 0.25, 0.5, 0.75, 1, 1.25, 1.5, 2, 2.25, 2.5, 3, 3.25, 3.5];
      offs.forEach((o, i) => {
        const up = [0, 7, 12, 0, 0, 7, 12, 12, 19, 12, 24, 19, 15][i % 13];
        push(r + o, 'pluck', ch[i % 3] + up, 0.42, i % 3 === 0 ? 0.3 : 0.15);
      });
    }
    const mel = [
      [1.5, nt('C5'), 0.42, 0.34], [3.5, nt('E5'), 0.42, 0.3], [5.5, nt('D5'), 0.42, 0.32],
      [9.5, nt('B4'), 0.42, 0.32], [11.5, nt('D5'), 0.42, 0.3], [13.5, nt('C5'), 1.2, 0.36],
      [17.5, nt('A4'), 0.42, 0.32], [19.5, nt('C5'), 0.42, 0.3], [21.5, nt('E5'), 1, 0.36],
      [25.5, nt('F4'), 0.42, 0.3], [27.5, nt('A4'), 0.42, 0.3], [29.5, nt('G4'), 1.4, 0.36]
    ];
    mel.forEach(x => push(x[0], 'pluck', x[1], x[2], x[3]));
    return { bpm: 96, lenBeats, events };
  })();

  TRACKS.memory = (function () {
    const events = {};
    const lenBeats = 32;
    const push = (b, inst, n, d, v) => {
      const beat = Math.floor(b);
      if (!events[beat]) events[beat] = [];
      events[beat].push({ name: inst, n, d, v });
    };
    const Fmaj7 = [nt('F3'), nt('A3'), nt('C4'), nt('E4')];
    const C6 = [nt('C4'), nt('E4'), nt('G4'), nt('A3')];
    const Am7 = [nt('A3'), nt('C4'), nt('E4'), nt('G4')];
    const Bb = [nt('Bb3'), nt('D4'), nt('F4'), nt('G3')];
    const bars = [Fmaj7, C6, Am7, Bb, Fmaj7, C6, Am7, C6];
    for (let b = 0; b < 8; b++) {
      const ch = bars[b];
      const r = b * 4;
      ch.forEach(n => push(r, 'pad', n + 12, 3.6, 0.22));
      push(r, 'bass', ch[0], 3.8, 0.28);
      ch.forEach(n => push(r + 2, 'pad', n + 24, 3.4, 0.1));
    }
    const bells = [
      [1, nt('A5'), 2.2, 0.22], [5, nt('E5'), 2, 0.18], [9, nt('F5'), 2.5, 0.22], [13, nt('C5'), 2.4, 0.2],
      [17, nt('D5'), 2.2, 0.2], [21, nt('E5'), 2.4, 0.22], [25, nt('C5'), 3, 0.24], [30, nt('B4'), 1.8, 0.2]
    ];
    bells.forEach(x => push(x[0], 'bell', x[1], x[2], x[3]));
    return { bpm: 70, lenBeats, events };
  })();

  TRACKS.tension = (function () {
    const events = {};
    const lenBeats = 16;
    const push = (b, inst, n, d, v) => {
      const beat = Math.floor(b);
      if (!events[beat]) events[beat] = [];
      events[beat].push({ name: inst, n, d, v });
    };
    for (let b = 0; b < 4; b++) {
      const r = b * 4;
      push(r, 'bass', nt('A2'), 3.8, 0.5);
      push(r + 2, 'bass', nt('E2'), 3.8, 0.34);
      push(r, 'pad', nt('A3'), 3.6, 0.13);
      push(r, 'pad', nt('C4'), 3.6, 0.12);
      push(r + 1, 'pad', nt('E4'), 3.4, 0.09);
      push(r, 'pad', nt('F3'), 7.4, 0.05);
      push(r, 'tick', nt('C8'), 0.02, 0.5);
      push(r + 1, 'tick', nt('C8'), 0.02, 0.38);
      push(r + 2, 'tick', nt('C8'), 0.02, 0.5);
      push(r + 3.25, 'tick', nt('C8'), 0.02, 0.3);
    }
    return { bpm: 56, lenBeats, events };
  })();

  TRACKS.festival = (function () {
    const events = {};
    const lenBeats = 32;
    const push = (b, inst, n, d, v) => {
      const beat = Math.floor(b);
      if (!events[beat]) events[beat] = [];
      events[beat].push({ name: inst, n, d, v });
    };
    const Am = [nt('A3'), nt('C4'), nt('E4')];
    const F = [nt('F3'), nt('A3'), nt('C4')];
    const Cg = [nt('C4'), nt('E4'), nt('G4')];
    const G = [nt('G3'), nt('B3'), nt('D4')];
    const bars = [Am, F, Cg, G, F, Cg, G, Am];
    for (let b = 0; b < 8; b++) {
      const ch = bars[b];
      const r = b * 4;
      push(r, 'bass', ch[0] - 24, 3.6, 0.44);
      push(r, 'drum', 0, 0.5, 0.5);
      push(r + 2, 'drum', 0, 0.5, 0.34);
      for (let s = 0; s < 8; s++) {
        const bx = r + s * 0.5;
        const n = ch[s % 3] + (s % 2 ? 12 : 0);
        push(bx, 'pluck', n, 0.4, s % 2 ? 0.16 : 0.24);
      }
    }
    const mel = [
      [0, nt('A4'), 1, 0.26], [1.5, nt('C5'), 0.5, 0.22], [2.5, nt('E5'), 1.2, 0.26],
      [4.5, nt('C5'), 0.5, 0.2], [6, nt('F5'), 1.6, 0.28],
      [9, nt('E5'), 0.8, 0.22], [10.5, nt('C5'), 1.2, 0.24],
      [14, nt('D5'), 0.6, 0.22], [15, nt('E5'), 0.8, 0.22], [16, nt('G5'), 1.6, 0.3],
      [20, nt('A5'), 0.8, 0.24], [21.5, nt('G5'), 0.6, 0.22], [23, nt('E5'), 1.2, 0.24],
      [26, nt('C5'), 1, 0.22], [28, nt('A4'), 1.4, 0.26], [30, nt('C5'), 1.6, 0.26]
    ];
    mel.forEach(x => push(x[0], 'pluck', x[1], x[2], x[3]));
    return { bpm: 116, lenBeats, events };
  })();
}

function createCharMesh(cfg, scene) {
  const g = new THREE.Group();
  const mat = c => new THREE.MeshStandardMaterial({ color: c, roughness: 0.85, metalness: 0.02, flatShading: true });
  const skinM = mat(cfg.skin);
  const hairM = mat(cfg.hair);
  const hair2M = mat(cfg.hair2);
  const topM = mat(cfg.top);
  const bottomM = mat(cfg.bottom);
  const accentM = mat(cfg.accent);
  const shoeM = mat(cfg.shoes);

  const body = new THREE.Mesh(new THREE.CapsuleGeometry(0.38, 0.42, 4, 10), topM);
  body.position.y = 1.04;
  g.add(body);

  const pelvis = new THREE.Mesh(new THREE.CylinderGeometry(0.36, 0.42, 0.34, 10), bottomM);
  pelvis.position.y = 0.82;
  g.add(pelvis);

  const skirt = new THREE.Mesh(new THREE.CylinderGeometry(0.62, 0.78, 0.5, 12, 1, true), bottomM);
  skirt.position.y = 0.72;

  const legL = new THREE.Group();

  footL.position.set(0, -0.44, 0.05);
  legL.add(legMeshL, footL);
  legL.position.set(-0.16, 0.86, 0);

      armR.rotation.z = -0.14 - sway;

        char.walkPhase += dt * (4 + char.speed * 3);
        const ph = char.walkPhase;
        legL.rotation.x = Math.sin(ph) * 0.55;
        legR.rotation.x = Math.sin(ph + Math.PI) * 0.55;
        armL.rotation.x = Math.sin(ph + Math.PI) * 0.4;
        armR.rotation.x = Math.sin(ph) * 0.4;
        head.position.y = 1.72 + Math.abs(Math.sin(ph)) * 0.02;
        char.faceTarget = null;
      } else {
        const k = Math.min(1, char.speed / 0.1);
        legL.rotation.x *= (1 - k);
        legR.rotation.x *= (1 - k);
        armL.rotation.x *= (1 - k);
        armR.rotation.x *= (1 - k);
        head.position.y = 1.72 + bob;
      }
      char.blinkT -= dt;
      if (!char.blinkOn && char.blinkT <= 0) {
        char.blinkOn = true;
        face.material.map = blinkTex;
        face.material.needsUpdate = true;
      } else if (char.blinkOn) {
        if (char.blinkT <= -0.12) {
          char.blinkOn = false;
          char.blinkT = 1.8 + Math.random() * 3;
          face.material.map = faceTex;
          face.material.needsUpdate = true;
        }
      }
      const m = Math.min(1, Math.max(0, char.talk));
      mouth.scale.set(1, 0.25 + m * 0.75, 1);
      mouth.position.y = -0.3 + m * 0.015;
      char.talk *= 0.86;
    }
  };
  return char;
}

function starShape(ctx, x, y, r, rr) {
  ctx.beginPath();
  for (let i = 0; i < 10; i++) {
    const a = (Math.PI * i) / 5 - Math.PI / 2;
    const rad = i % 2 === 0 ? r : rr;
    const px = x + Math.cos(a) * rad;
    const py = y + Math.sin(a) * rad;
    if (i === 0) ctx.moveTo(px, py);
    else ctx.lineTo(px, py);
  }
  ctx.closePath();
}

      try {
        const bin = atob(b64);
        const len = bin.length;
        const buf = new Uint8Array(len);
        for (let i = 0; i < len; i++) buf[i] = bin.charCodeAt(i);
        const loader = new GLTFLoader();
        loader.parse(buf.buffer, '', gltf => {
          wrapGLB(key, gltf).then(resolve).catch(() => resolve(null));
        }, () => resolve(null));
      } catch (e) { resolve(null); }
    });
    if (!timeoutMs) return run;
    return Promise.race([run, new Promise(res => setTimeout(() => res(null), timeoutMs))]);
  }
};

async function wrapGLB(key, gltf) {
  const root = gltf.scene || gltf.scenes[0];
  const group = new THREE.Group();
  group.add(root);
  const meshes = [];
  root.traverse(o => { if (o.isMesh) meshes.push(o); });

  const json = gltf.parser.json;
  const vrm = json.extensions && json.extensions.VRM;
  const boneMap = {};
  if (vrm && vrm.humanoid && Array.isArray(vrm.humanoid.humanBones)) {
    const want = ['hips', 'spine', 'chest', 'neck', 'head',
      'leftUpperLeg', 'rightUpperLeg', 'leftLowerLeg', 'rightLowerLeg',
      'leftUpperArm', 'rightUpperArm', 'leftLowerArm', 'rightLowerArm',
      'leftFoot', 'rightFoot'];
    for (const hb of vrm.humanoid.humanBones) {
      if (want.includes(hb.bone)) {
        try { boneMap[hb.bone] = await gltf.parser.getDependency('node', hb.node); }
        catch (e) {}
      }
    }
  }
  const boneFallback = [
    ['hips', 'HipMaster'], ['spine', 'Torso'], ['neck', 'Neck'], ['head', 'Head'],
    ['leftUpperLeg', 'LeftHip'], ['rightUpperLeg', 'RightHip'],
    ['leftLowerLeg', 'LeftKnee'], ['rightLowerLeg', 'RightKnee'],
    ['leftUpperArm', 'LeftShoulder'], ['rightUpperArm', 'RightShoulder'],
    ['leftLowerArm', 'LeftElbow'], ['rightLowerArm', 'RightElbow'],
    ['leftFoot', 'LeftFoot'], ['rightFoot', 'RightFoot']
  ];
  for (const [bk, kw] of boneFallback) {
    if (boneMap[bk]) continue;
    for (const m of meshes) {
      if (!m.skeleton) continue;
      for (const b of m.skeleton.bones) {
        if (b.name.includes(kw)) { boneMap[bk] = b; break; }
      }
      if (boneMap[bk]) break;
    }
  }

  group.updateMatrixWorld(true);
  const tmpV = new THREE.Vector3();
  const footYs = [];
  if (boneMap.leftFoot) footYs.push(boneMap.leftFoot.getWorldPosition(tmpV).y);
  if (boneMap.rightFoot) footYs.push(boneMap.rightFoot.getWorldPosition(tmpV).y);
  const feetY = footYs.length ? Math.min(...footYs) : null;
  const headY = boneMap.head ? boneMap.head.getWorldPosition(tmpV).y : null;
  let scale;
  const meshBox = new THREE.Box3();
  let anyMesh = false;
  for (const m of meshes) {
    if (!m.geometry || !m.geometry.attributes || !m.geometry.attributes.position) continue;
    meshBox.union(new THREE.Box3().setFromObject(m));
    anyMesh = true;
  }
  if (anyMesh) {
    const h = Math.max(0.2, meshBox.max.y - meshBox.min.y);
    scale = VRM_NORM_HEIGHT / h;
    root.scale.multiplyScalar(scale);
    root.position.y = -meshBox.min.y * scale;
  } else if (feetY !== null && headY !== null) {
    scale = VRM_NORM_HEIGHT / Math.max(0.2, headY - feetY);
    root.scale.multiplyScalar(scale);
    root.position.y = -feetY * scale;
  } else {
    const box = new THREE.Box3().setFromObject(root);
    const h = Math.max(0.2, box.max.y - box.min.y);
    scale = VRM_NORM_HEIGHT / h;
    root.scale.multiplyScalar(scale);
    root.position.y = -box.min.y * scale;
  }
  if (VRM_FACE_OFFSET) root.rotation.y = VRM_FACE_OFFSET;
  group.updateMatrixWorld(true);

  const exprGroups = {};
  if (vrm && vrm.blendShapeMaster && Array.isArray(vrm.blendShapeMaster.blendShapeGroups)) {
    for (const g of vrm.blendShapeMaster.blendShapeGroups) {
      const nm = g.name || g.presetName;
      if (!nm) continue;
      exprGroups[nm] = (exprGroups[nm] || []).concat(g);
    }
  }
  // VRoid baked models carry COLOR_0 vertex colors whose alpha is 0 (RGB only holds
  // baked shading/material ids). With alphaMode MASK + alphaTest, alpha 0 discards
  // every fragment, making the whole model invisible. Textures hold the real colors,
  // so vertex colors must be disabled.
  for (const m of meshes) {
    const mats = Array.isArray(m.material) ? m.material : [m.material];
    for (const mat of mats) {
      if (mat) mat.vertexColors = false;
    }
  }
  // map glTF JSON mesh index -> the THREE.Mesh objects created per primitive
  const meshObjMap = new Map();
  if (json && Array.isArray(json.nodes)) {
    await Promise.all(json.nodes.map(async (n, i) => {
      if (n.mesh === undefined) return;
      try {
        const node = await gltf.parser.getDependency('node', i);
        const ms = node.isMesh ? [node] : node.children.filter(c => c.isMesh);
        if (!ms.length) return;
        const list = meshObjMap.get(n.mesh) || [];
        list.push(...ms);
        meshObjMap.set(n.mesh, list);
      } catch (e) {}
    }));
  }
  const morphMeshes = meshes.filter(m => m.morphTargetInfluences);
  const applyGroups = (groups, weight) => {
    for (const g of groups) {
      const mt = g.binds || g.morphTargets;
      if (!mt) continue;
      const isBinds = !!g.binds;
      for (const t of mt) {
        const targets = meshObjMap.get(t.mesh) || (meshes[t.mesh] ? [meshes[t.mesh]] : []);
        for (const mesh of targets) {
          if (!mesh.morphTargetInfluences) continue;
          const idx = t.index;
          if (idx >= 0 && idx < mesh.morphTargetInfluences.length) {
            const tw = isBinds ? (t.weight || 100) / 100 : (t.weight || 1);
            mesh.morphTargetInfluences[idx] = Math.min(1, mesh.morphTargetInfluences[idx] + tw * weight);
          }
        }
      }
    }
  };

  const boneBase = {};
  const captureBase = (b) => {
    const base = {};
    if (!b) return base;
    base.rx = b.rotation.x; base.ry = b.rotation.y; base.rz = b.rotation.z;
    base.y = b.position.y;
    return base;
  };
  for (const k of ['hips', 'head', 'leftUpperLeg', 'rightUpperLeg', 'leftLowerLeg', 'rightLowerLeg',
    'leftUpperArm', 'rightUpperArm', 'leftLowerArm', 'rightLowerArm']) {
    boneBase[k] = captureBase(boneMap[k]);
  }
  // VRM bind pose is a literal T-pose (arms horizontal). Drop the arms to a
  // natural hanging rest so the character doesn't stand like a cross.
  if (boneBase.leftUpperArm) boneBase.leftUpperArm.rz += 1.35;
  if (boneBase.rightUpperArm) boneBase.rightUpperArm.rz -= 1.35;
  if (boneBase.leftLowerArm) boneBase.leftLowerArm.rx += -0.12;
  if (boneBase.rightLowerArm) boneBase.rightLowerArm.rx += -0.12;

  const exprResolved = {};
  for (const e in VRM_EXPR_MAP) {
    const out = [];
    for (const [nm, w] of VRM_EXPR_MAP[e]) {
      if (exprGroups[nm]) { out.push([nm, w]); continue; }
      const fb = VRM_EXPR_FALLBACK[nm];
      let ok = false;
      if (fb) {
        for (const alt of fb) {
          if (exprGroups[alt]) { out.push([alt, w]); ok = true; break; }
        }
      }
      if (!ok) out.push(['Neutral', Math.min(w, 0.8)]);
    }
    exprResolved[e] = out;
  }

  const char = {
    group,
    refs: {},
    mats: {},
    expr: 'normal',
    walkPhase: 0,
    speed: 0,
    blinkT: 1.5 + Math.random() * 2,
    blinkOn: false,
    talk: 0,
    outfit: 'uniform',
    bone: boneMap,
    morphMeshes: morphMeshes,
    _exprTarget: new Map(),
    _exprCur: new Map(),
    _swing: { legL: 0, legR: 0, kneeL: 0, kneeR: 0, armL: 0, armR: 0, hipY: 0 },

    setExpr(e) {
      char.expr = e in exprResolved ? e : 'normal';
      char._exprTarget.clear();
      for (const [nm, wgt] of exprResolved[char.expr]) char._exprTarget.set(nm, wgt);
    },

    setTalk(t) {
      char.talk = t;
    },

    setOutfit(kind) {
      char.outfit = kind === 'yukata' ? 'yukata' : 'uniform';
      for (const m of meshes) {
        const mats = Array.isArray(m.material) ? m.material : [m.material];
        for (const mat of mats) {
          if (!mat || !mat.color) continue;
          const n = (mat.name || '').toLowerCase();
          const isCloth = VRM_CLOTH_KW.some(kw => n.includes(kw));
          const isSkip = VRM_SKIP_KW.some(kw => n.includes(kw));
          if (!isCloth || isSkip) continue;
          mat.color.set(char.outfit === 'yukata' ? 0xffb7cd : 0xffffff);
        }
      }
    },

    update(dt, time) {
      const cur = char._exprCur;
      for (const [nm, t] of char._exprTarget) {
        const c = cur.get(nm) || 0;
        cur.set(nm, c + (t - c) * Math.min(1, dt * 8));
      }
      for (const nm of Array.from(cur.keys())) {
        if (char._exprTarget.has(nm)) continue;
        const c = cur.get(nm) || 0;
        if (c < 0.01) cur.delete(nm);
        else cur.set(nm, c * Math.max(0, 1 - dt * 8));
      }
      char.blinkT -= dt;
      if (!char.blinkOn && char.blinkT <= 0) char.blinkOn = true;
      else if (char.blinkOn && char.blinkT <= -0.12) {
        char.blinkOn = false;
        char.blinkT = 1.6 + Math.random() * 3;
      }
      char.talk *= 0.86;

      for (const m of char.morphMeshes) {
        const inf = m.morphTargetInfluences;
        inf.fill(0);
        for (const [nm, w] of cur) {
          const gs = exprGroups[nm];
          if (gs) applyGroups(gs, w);
        }
        if (char.blinkOn) {
          const gs = exprGroups['Blink'];
          if (gs) applyGroups(gs, 0.85);
        }
        if (char.talk > 0.03) {
          const gs = exprGroups['A'];
          if (gs) applyGroups(gs, Math.min(1, char.talk * 0.85));
        }
      }

      const sw = char._swing;
      if (char.speed > 0.15) {
        char.walkPhase += dt * (4 + char.speed * 3);
        const ph = char.walkPhase;
        sw.legL = Math.sin(ph) * 0.5;
        sw.legR = Math.sin(ph + Math.PI) * 0.5;
        sw.kneeL = Math.max(0, Math.sin(ph)) * 0.5;
        sw.kneeR = Math.max(0, Math.sin(ph + Math.PI)) * 0.5;
        sw.armL = Math.sin(ph) * 0.35;
        sw.armR = Math.sin(ph + Math.PI) * 0.35;
        sw.hipY = Math.abs(Math.sin(ph)) * 0.022;
      } else {
        const kd = Math.min(1, dt * 6);
        for (const kk in sw) sw[kk] *= (1 - kd);
      }
      const b = char.bone;
      const bb = boneBase;
      if (b.leftUpperLeg) b.leftUpperLeg.rotation.x = bb.leftUpperLeg.rx + sw.legL;
      if (b.rightUpperLeg) b.rightUpperLeg.rotation.x = bb.rightUpperLeg.rx + sw.legR;
      if (b.leftLowerLeg) b.leftLowerLeg.rotation.x = bb.leftLowerLeg.rx + sw.kneeL;
      if (b.rightLowerLeg) b.rightLowerLeg.rotation.x = bb.rightLowerLeg.rx + sw.kneeR;
      if (b.leftUpperArm) b.leftUpperArm.rotation.x = bb.leftUpperArm.rx + sw.armL;
      if (b.rightUpperArm) b.rightUpperArm.rotation.x = bb.rightUpperArm.rx + sw.armR;
      if (b.hips) b.hips.position.y = bb.hips.y + Math.sin(time * 1.8) * 0.006 + sw.hipY;
      if (b.head) {
        b.head.rotation.z = bb.head.rz + Math.sin(time * 0.9) * 0.02;
        b.head.rotation.y = bb.head.ry + Math.sin(time * 0.6) * 0.03;
      }
      if (b.leftUpperArm) b.leftUpperArm.rotation.z = bb.leftUpperArm.rz + Math.sin(time * 1.1) * 0.025;
      if (b.rightUpperArm) b.rightUpperArm.rotation.z = bb.rightUpperArm.rz - Math.sin(time * 1.1) * 0.025;
      if (b.leftLowerArm) b.leftLowerArm.rotation.x = bb.leftLowerArm.rx;
      if (b.rightLowerArm) b.rightLowerArm.rotation.x = bb.rightLowerArm.rx;
    }
  };
  char.setExpr('normal');
  return char;
}

/* ==== 03_world.js ==== */
const LOC_POS = {
  classroom: new THREE.Vector3(-13, 0, 5.2),
  schoolyard: new THREE.Vector3(0, 0, 15),
  courtyard: new THREE.Vector3(0, 0, -3),
  library: new THREE.Vector3(13.5, 0, 7),
  oldschool: new THREE.Vector3(-5, 0, -10.5),
  tower: new THREE.Vector3(-4.5, 0, -12),
  festival: new THREE.Vector3(0, 0, 18)
};

const PHASES = {
  afternoon: {
    skyTop: 0x8fc0f0, skyBottom: 0xfff3d6, fog: 0xe8f2e8,
    sun: 0xfff2c4, sunI: 1.3, sunPos: [120, 80, 60],
    amb: 0xffffff, ambInt: 0.75, window: 0, lantern: 0, stars: 0,
    petal: 1, firefly: 0
  },
  sunset: {
    skyTop: 0x8f9fd6, skyBottom: 0xffc79b, fog: 0xf2cfa8,
    sun: 0xffb370, sunI: 1.1, sunPos: [130, 36, 24],
    amb: 0xffe9e0, ambInt: 0.62, window: 0, lantern: 0, stars: 0,
    petal: 1, firefly: 0.1
  },
  dusk: {
    skyTop: 0x6a7fc0, skyBottom: 0xffa98e, fog: 0xd9c9a2,
    sun: 0xffa06a, sunI: 0.6, sunPos: [150, 18, 40],
    amb: 0xffb8a8, ambInt: 0.45, window: 0.6, lantern: 0.1, stars: 0.3,

  },
  night: {
    skyTop: 0x1b2450, skyBottom: 0x55648f, fog: 0x3a4a6f,
    sun: 0xffd9a0, sunI: 0.6, sunPos: [-90, 46, 90],
    amb: 0x556aa0, ambInt: 1.2, window: 1, lantern: 1, stars: 1,
    petal: 0, firefly: 0
  }
};

const World = {
  scene: null,
  camera: null,
  renderer: null,
  time: 0,
  phase: 'afternoon',
  markers: {},
  interactables: [],
  colliders: [],
  windowMats: [],
  festMats: [],
  lanternLights: [],
  cur: null,
  tgt: null,
  fireworksOn: false,
  fireTimer: 0,
  burstSys: null,
  petals: [],
  fireflies: [],
  fireflyItems: [],
  indoor: false,
  indoorGrp: null,
  outdoorGrp: null,
  indoorLights: [],
  indoorColliders: [],

  init(renderer, scene, camera) {
    this.renderer = renderer;
    this.scene = scene;
    this.camera = camera;
    scene.fog = new THREE.Fog(0xe8f2e8, 55, 150, 160);
    this.initPhaseState();
    this.buildSky();
    this.buildStatic();
    this.buildIndoor();
    this.buildLights();
    this.buildMarkers();
    this.buildParticles();
    this.buildFireworks();
  },

  initPhaseState() {
    const base = PHASES.afternoon;
    this.cur = {
      skyTop: new THREE.Color(base.skyTop), skyBottom: new THREE.Color(base.skyBottom),
      fog: new THREE.Color(base.fog), sun: new THREE.Color(base.sun),
      amb: new THREE.Color(base.amb), sunPos: base.sunPos.slice(),
      sunI: base.sunI, ambInt: base.ambInt, window: 0, lantern: 0, stars: 0,
      petal: base.petal, firefly: 0
    };
    this.tgt = Object.assign({}, this.cur);
    this.setPhase('afternoon');
  },

  setPhase(name) {
    this.phase = name;
    const P = PHASES[name];
    this.tgt = {
      skyTop: new THREE.Color(P.skyTop), skyBottom: new THREE.Color(P.skyBottom),
      fog: new THREE.Color(P.fog), sun: new THREE.Color(P.sun), sunPos: P.sunPos.slice(),
      amb: new THREE.Color(P.amb), sunI: P.sunI, ambInt: P.ambInt,
      window: P.window, lantern: P.lantern, stars: P.stars, petal: P.petal, firefly: P.firefly
    };
  },

  blend(dt) {
    const k = Math.min(1, dt * 0.55);
    const c = this.cur, t = this.tgt;
    c.skyTop.lerp(t.skyTop, k);
    c.skyBottom.lerp(t.skyBottom, k);
    c.fog.lerp(t.fog, k);
    c.sun.lerp(t.sun, k);
    c.amb.lerp(t.amb, k);
    c.sunI += (t.sunI - c.sunI) * k;
    c.ambInt += (t.ambInt - c.ambInt) * k;
    c.window += (t.window - c.window) * k;
    c.lantern += (t.lantern - c.lantern) * k;
    c.stars += (t.stars - c.stars) * k;
    c.petal += (t.petal - c.petal) * k;
    c.firefly += (t.firefly - c.firefly) * k;
    for (let i = 0; i < 3; i++) c.sunPos[i] += (t.sunPos[i] - c.sunPos[i]) * k;
  },

  applyPhase() {
    const c = this.cur;
    const inD = this.indoor;
    this.sky.material.uniforms.topColor.value.copy(c.skyTop);
    this.sky.material.uniforms.bottomColor.value.copy(c.skyBottom);
    if (inD) {
      this.scene.fog.color.set(0xfff2e0);
      this.scene.fog.near = 10;
      this.scene.fog.far = 45;
    } else {
      this.scene.fog.color.copy(c.fog);
      this.scene.fog.near = 300 + c.stars * 120;
      this.scene.fog.far = 470 - c.stars * 120;
    }
    for (const l of this.sunLights) {
      l.color.copy(c.sun);
      l.intensity = c.sunI * (inD ? 0.55 : 1);
    }
    this.hemi.intensity = c.ambInt * (inD ? 0.8 : 1);
    this.hemi.color.copy(c.amb);
    this.stars.material.opacity = c.stars * 0.85;
    for (const m of this.windowMats) m.emissiveIntensity = c.window * 1.4;
    const lanK = c.lantern;
    if (this.festGrp) {
      this.festGrp.visible = !inD && lanK > 0.15;
      this.festGrp.traverse(o => {
        if (o.isMesh && o.userData.lan) o.material.emissiveIntensity = 1.2 + lanK * 1.2;
      });
    }
    for (const pl of this.festLights) pl.intensity = lanK * 1.6;
    this.petalMat.opacity = c.petal * 0.95;
    this.ffMat.opacity = c.firefly * 0.85;
  },

  buildSky() {
    const geo = new THREE.SphereGeometry(420, 24, 16);
    const mat = new THREE.ShaderMaterial({
      side: THREE.BackSide,
      uniforms: {
        topColor: { value: new THREE.Color(0x8fc0f0) },
        bottomColor: { value: new THREE.Color(0xfff3d6) }
      },
      vertexShader: 'varying vec3 vP; void main(){ vP = position; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }',
      fragmentShader: `varying vec3 vP; uniform vec3 topColor; uniform vec3 bottomColor;
        void main(){ float h = clamp(vP.y/300.0,-1.0,1.0)*0.5+0.5; gl_FragColor = vec4(mix(bottomColor, topColor, pow(h,1.1)),1.0); }`
    });
    this.sky = new THREE.Mesh(geo, mat);
    this.sky.frustumCulled = false;
    this.scene.add(this.sky);

    const n = 420;
    const sp = new Float32Array(n * 3);
    for (let i = 0; i < n; i++) {
      const a = Math.random() * Math.PI * 2;
      const r = 200 + Math.random() * 180;
      sp[i * 3] = Math.cos(a) * r;
      sp[i * 3 + 1] = 90 + Math.random() * 200;
      sp[i * 3 + 2] = Math.sin(a) * r;
    }
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.BufferAttribute(sp, 3));
    this.stars = new THREE.Points(g, new THREE.PointsMaterial({ color: 0xffffff, size: 1.6, transparent: true, opacity: 0, fog: false }));
    this.stars.frustumCulled = false;
    this.scene.add(this.stars);
  },

  buildLights() {
    this.hemi = new THREE.HemisphereLight(0xffffff, 0xbfd8b0, 0.75);
    this.scene.add(this.hemi);
    this.sunLights = [];
    const sun = new THREE.DirectionalLight(0xfff2cc, 1.3);
    this.scene.add(sun);
    this.sunLights.push(sun);
    const fill = new THREE.DirectionalLight(0xbfd8ff, 0.25);
    this.scene.add(fill);
    this.fillLight = fill;
    this.festLights = [];
    for (let i = 0; i < 3; i++) {
      const pl = new THREE.PointLight(0xff9a6a, 0, 26, 1.8);
      const spots = [[-4, 3.4, 26], [4, 3.4, 34], [0, 3.4, 20]];
      pl.position.set(spots[i][0], spots[i][1], spots[i][2]);
      this.scene.add(pl);
      this.festLights.push(pl);
    }
  },

  buildStatic() {
    const g2 = new THREE.Group();
    this.scene.add(g2);
    const G = THREE.MeshStandardMaterial;
    const mk = (geo, col, y, x = 0, z = 0, rotY = 0) => {
      const m = new THREE.Mesh(geo, col instanceof G ? col : new G({ color: col, roughness: 0.9 }));
      m.position.set(x, y, z);
      m.rotation.y = rotY;
      g2.add(m);
      return m;
    };
    const dummy = new THREE.Object3D();

    // ---------- shared materials ----------
    const frameM = new G({ color: 0xf2ede2, roughness: 0.8 });
    const sillM = new G({ color: 0xd8d2c4, roughness: 0.9 });
    const stoneM = new G({ color: 0x9a9a92, roughness: 0.85 });
    const soilM = new G({ color: 0x8a6a52, roughness: 1 });
    const darkWoodM = new G({ color: 0x6e5a48, roughness: 0.95 });
    const roofM = new G({ color: 0x8ca8c8, roughness: 0.95 });
    const glassM = new G({ color: 0xaac8e8, emissive: 0xfff2cc, emissiveIntensity: 0, roughness: 0.4 });
    this.windowMats.push(glassM);

    // ---------- ground ----------
    const grass = new G({ color: 0xbce2a2, roughness: 1 });
    mk(new THREE.PlaneGeometry(140, 140), grass, 0, 0, 0, 0).rotation.x = -Math.PI / 2;

    const pathM = new G({ color: 0xe9dfc4, roughness: 1 });
    const path = (pts, w) => {
      const shape = new THREE.Shape();
      shape.moveTo(pts[0][0] - w / 2, pts[0][1] - w / 2);
      for (let i = 1; i < pts.length; i++) shape.lineTo(pts[i][0] - w / 2, pts[i][1] - w / 2);
      for (let i = pts.length - 1; i >= 0; i--) shape.lineTo(pts[i][0] + w / 2, pts[i][1] + w / 2);
      shape.closePath();
      const m = new THREE.Mesh(new THREE.ShapeGeometry(shape), pathM);
      m.rotation.x = -Math.PI / 2;
      m.position.y = 0.02;
      g2.add(m);
    };
    path([[ -12, 10.5], [0, -1], [0, 15], [0, 22]], 2.2);
    path([[13.5, 7], [5, 2]], 2.0);
